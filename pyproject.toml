[project]
name = "emotion-aware-llm-finetuning"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "protobuf>=7.35.1",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "transformers>=5.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emotion_llm"]

[tool.pytest.ini_options]
markers = ["network: test hits the network (loads a real dataset/model)"]
testpaths = ["tests"]
